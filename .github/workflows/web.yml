name: Client & Web checks

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/web/**"
      - "apps/mobile/**"
      - "apps/landing/**"
      - "crates/padu-protocol/**"
      - "themes.json"
      - "scripts/generate-themes.ts"
      - "Cargo.lock"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/web/**"
      - "apps/mobile/**"
      - "apps/landing/**"
      - "crates/padu-protocol/**"
      - "themes.json"
      - "scripts/generate-themes.ts"
      - "Cargo.lock"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Protocol, client packages & apps
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: web-checks-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            web-checks-rust-1.96.0-cargo-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check generated protocol & theme synchronization
        run: |
          bun run protocol:check
          bun run theme:check

      - name: Check client package (@padu/client)
        run: |
          bun run --filter @padu/client check
          bun run --filter @padu/client test

      - name: Check web app (@padu/web)
        run: |
          bun run web:typecheck
          bun run web:test
          bun run web:build

      - name: Check landing app (@padu/landing)
        run: |
          bun run landing:typecheck
          bun run landing:test
          bun run landing:build

      - name: Check mobile app (@padu/mobile)
        run: |
          bun run mobile:typecheck
          bun run mobile:test