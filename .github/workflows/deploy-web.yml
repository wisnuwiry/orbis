name: Deploy Web to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "crates/padu-protocol/**"
      - "themes.json"
      - "scripts/generate-themes.ts"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck client package
        run: bun run --filter @padu/client check

      - name: Test client package
        run: bun run --filter @padu/client test

      - name: Typecheck web app
        run: bun run web:typecheck

      - name: Test web app
        run: bun run web:test

      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
