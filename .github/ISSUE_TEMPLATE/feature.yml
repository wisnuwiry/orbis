name: Feature request
description: Propose a change in Padu
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Be concrete. If this is a **pi** gap, say so — we implement on Padu, not as a TypeScript copy.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS
        - Web
        - Protocol
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Problem today, and what Padu should do instead.
    validations:
      required: true